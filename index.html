<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocean Gang</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="ui">
      <div id="score" style="display:none">Crates: 0</div>
    </div>

    <!-- Strudel Music Editor Panel -->
    <div id="music-panel" class="music-panel hidden">
      <div id="music-now-playing" class="music-now-playing">
        <div class="music-now-playing-copy">
          <div id="music-now-playing-label" class="music-now-playing-label">Now Playing</div>
          <div id="music-now-playing-title" class="music-now-playing-title">Treasure Map</div>
        </div>
        <div class="music-now-playing-controls">
          <button id="music-prev" class="music-now-btn" title="Previous track">&#9664;</button>
          <input type="range" id="music-scene-scrubber" class="music-scene-scrubber" min="0" max="0" value="0">
          <button id="music-next" class="music-now-btn" title="Next track">&#9654;</button>
        </div>
      </div>
      <div id="music-titlebar" class="music-titlebar">
        <span class="music-title">Strudel</span>
        <div class="music-titlebar-controls">
          <select id="music-scene-select" class="music-scene-select" title="Choose a scene">
            <!-- populated dynamically from SCENES in music.js -->
          </select>
          <button id="music-save" class="music-btn music-btn-save" title="Save current patch">Save</button>
          <button id="music-save-variation" class="music-btn music-btn-save" title="Save as variation">Save As Variation</button>
          <button id="music-delete-variation" class="music-btn music-btn-save" title="Delete current variation">Delete Variation</button>
          <button id="music-close" class="music-btn music-btn-close" title="Close (M)">&times;</button>
        </div>
      </div>
      <div class="music-volume-bar">
        <div class="music-vol-row">
          <label for="music-vol">Music</label>
          <input type="range" id="music-vol" min="0" max="100" value="100">
        </div>
        <div class="music-vol-row">
          <label for="sfx-vol">SFX</label>
          <input type="range" id="sfx-vol" min="0" max="100" value="35">
        </div>
      </div>
      <div id="music-preset-grid" class="music-preset-grid"></div>
      <div id="music-instruments" class="music-instruments"></div>
      <div id="music-editor-wrap" class="music-editor-wrap"></div>
      <div id="music-resize-handle" class="music-resize-handle"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
