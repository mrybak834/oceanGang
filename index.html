<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocean Gang</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="ui">
      <div id="score" style="display:none">Crates: 0</div>
      <div id="controls-hint">WASD to sail &middot; M = music &middot; G = sky &middot; P = perf</div>
    </div>

    <!-- Strudel Music Editor Panel -->
    <div id="music-panel" class="music-panel hidden">
      <div id="music-titlebar" class="music-titlebar">
        <span class="music-title">Strudel</span>
        <div class="music-titlebar-controls">
          <select id="music-scene-select" class="music-scene-select" title="Choose a scene">
            <option value="Calm Shores">Calm Shores</option>
            <option value="Night Voyage">Night Voyage</option>
            <option value="Tropical Breeze">Tropical Breeze</option>
            <option value="Storm Approaching">Storm Approaching</option>
          </select>
          <button id="music-close" class="music-btn music-btn-close" title="Close (M)">&times;</button>
        </div>
      </div>
      <div id="music-editor-wrap" class="music-editor-wrap"></div>
      <div id="music-resize-handle" class="music-resize-handle"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
